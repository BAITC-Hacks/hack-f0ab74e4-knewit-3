services:
  # Панель оператора: docker compose up --build → http://localhost:8501
  windcast:
    build: .
    image: windcast:latest
    ports:
      - "8501:8501"
    # Ключ нужен только для LLM-режима агента; без него работает --no-llm
    env_file:
      - path: .env
        required: false
    volumes:
      # Канонические прогнозы хоста видны панели, но контейнер не может их изменить
      - ./forecasts:/app/forecasts:ro

  # Offline-репетиция релиза без сети: docker compose run --rm reproduce
  # Результат — ./runs/reproduction-docker на хосте; каталог должен быть пустым или новым.
  # Строгий допуск по умолчанию 1e-9; переносимость обеспечивают округлённые признаки
  # и заново обученный комплект моделей (docs/REPRODUCIBILITY.md §6).
  reproduce:
    image: windcast:latest
    build: .
    profiles: ["check"]
    network_mode: none
    volumes:
      - ./runs:/app/runs
    command: ["python", "-m", "scripts.reproduce", "--output-dir", "/app/runs/reproduction-docker"]
